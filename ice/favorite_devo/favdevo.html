<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <div style="font-weight:bold;">Speaker</div>
        <div style="font-weight:bold;">Title</div>
        <div style="font-weight:bold;">Location</div>
        <div style="font-weight:bold;">Year</div>

        <div>Rob Garret</div>
        <div>He Will Make More of You</div>
        <div>I-Center</div>
        <div>2026</div>

        <div>Dallin H. Oaks</div>
        <div>Caming Closer to Jesus Christ</div>
        <div>I-Center</div>
        <div>2026</div>

        <div>James O. Fantone</div>
        <div>The Battle is the Lord's</div>
        <div>I-Center</div>
        <div>2026</div>

        <div>Alvin F. Meredith III</div>
        <div>The Mission of BYUI-Idaho</div>
        <div>I-Center</div>
        <div>2026</div>

        <form style="padding: 40;">
          <label for="Speaker">Speaker</label>
          <input type="text" name="Speaker">
        </form>

        <form>
          <label for="Title">Title</label>
          <input type="text">
        </form>

        <form>
          <label for="Location">Location</label>
          <input type="text">
        </form>

        <form>
          <label for="Year">Year</label>
          <input type="text">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
